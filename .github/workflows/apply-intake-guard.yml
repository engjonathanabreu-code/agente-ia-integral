name: Apply intake guard
on:
  push:
    paths:
      - '.github/workflows/apply-intake-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch webhook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Agente-IA-Integral-v1.0.3-INCOMING-CORRIGIDO/api/webhook.js')
          s = p.read_text()
          old = '''import {
            handleConversationStatusChanged,
            handleIncomingMessage,
          } from "../lib/agent.js";
          '''
          new = old + '''\nimport { guardIntakeMessage } from "../lib/intake-guard.js";\n'''
          if 'guardIntakeMessage' not in s:
              if old not in s:
                  raise SystemExit('Import anchor not found')
              s = s.replace(old, new, 1)
          anchor = '''    const result =
                await handleIncomingMessage(
                  payload
                );'''
          replacement = '''    const guarded = await guardIntakeMessage(payload);\n\n    const result = guarded ||\n      await handleIncomingMessage(\n        payload\n      );'''
          if 'const guarded = await guardIntakeMessage(payload);' not in s:
              if anchor not in s:
                  raise SystemExit('Processing anchor not found')
              s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "Integral Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Agente-IA-Integral-v1.0.3-INCOMING-CORRIGIDO/api/webhook.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: aplicar regras de nome e atendimento humano"
          git push
