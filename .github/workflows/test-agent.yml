name: Agent regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agente-IA-Integral-v1.0.3-INCOMING-CORRIGIDO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Agente-IA-Integral-v1.0.3-INCOMING-CORRIGIDO/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
