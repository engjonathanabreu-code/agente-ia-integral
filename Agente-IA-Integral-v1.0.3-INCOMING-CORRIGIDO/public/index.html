<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agente IA Integral</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#eaf7f5;background:#071b1d}

    main{width:min(720px,100%);background:#0d292b;border:1px solid #1b4445;border-radius:22px;padding:34px;box-sizing:border-box}

    h1{font-size:36px;margin:18px 0 8px}
    p{color:#b7cfcc;line-height:1.6}
    code{background:#071b1d;padding:3px 7px;border-radius:7px}
  </style>
</head>
<body>
<main>
  <span class="badge">Integral Soluções em Engenharia</span>
  <h1>Agente IA Integral</h1>
  <p>Serviço de atendimento inicial conectado ao Chatwoot e à OpenAI.</p>
  <p>Saúde da aplicação: <code>/api/health</code></p>
</main>
</body>
</html>
